  /jobs:
    get:
      summary: List jobs
      tags:
        - Jobs
      parameters:
        - in: query
          name: customer_id
          description: Filter to jobs for one customer.
          schema:
            type: string
        - in: query
          name: state
          description: Filter by lifecycle state. Default returns only active.
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - deleted
          example: 'active,deleted'
        - in: query
          name: 'date[gt]'
          description: Return results where the date field is strictly greater than this value.
          schema:
            type: string
            format: date-time
          example: '2026-07-01T00:00:00+00:00'
        - in: query
          name: 'date[gte]'
          description: Return results where the date field is greater than or equal to this value.
          schema:
            type: string
            format: date-time
        - in: query
          name: 'date[lt]'
          description: Return results where the date field is strictly less than this value.
          schema:
            type: string
            format: date-time
          example: '2026-07-31T23:59:59+00:00'
        - in: query
          name: 'date[lte]'
          description: Return results where the date field is less than or equal to this value.
          schema:
            type: string
            format: date-time
        - in: query
          name: keyword
          description: Free-text match across job name and location.
          schema:
            type: string
        - in: query
          name: schedule_ids
          description: Filter to jobs assigned to one or more schedules.
          schema:
            type: array
            items:
              type: string
          example: '0nk8PGvAO,1bC2dEfG'
        - in: query
          name: include
          description: |
            Expand related objects. Without `include`, list rows only carry
            the scalar `customer_id`. Every listed value adds a nested block.
          schema:
            type: array
            items:
              type: string
              enum:
                - customer
                - location
                - schedules
          example: 'customer,location,schedules'
        - in: query
          name: sort
          description: 'Prefix -[field] for descending order.'
          schema:
            type: array
            items:
              type: string
              enum:
                - date
                - created
          example: '-date'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  has_more:
                    type: boolean
        '401':
          description: Unauthorized error
        '403':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: object
                    nullable: true
                  message:
                    type: string
